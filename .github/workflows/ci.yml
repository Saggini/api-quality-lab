name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Testes funcionais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

  performance:
    name: Teste de performance (k6)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Subir a API
        run: |
          npm start &
          for i in {1..20}; do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done

      - uses: grafana/setup-k6-action@v1

      - name: Rodar k6
        run: k6 run k6/load.js --summary-export=resultado.json

      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-k6
          path: resultado.json